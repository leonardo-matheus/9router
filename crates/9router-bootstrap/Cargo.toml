[package]
name = "nine-router-bootstrap"
version = "0.5.69"
edition = "2021"
rust-version = "1.75"
authors = ["Leonardo <contato@leonardoms.dev>"]
description = "9Router bootstrap service - handles startup, process management, and health checks"
license = "MIT"
repository = "https://github.com/decolua/9router"
homepage = "https://9router.com"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# System utilities (home dir, PATH)
dirs = "6.0"

# Glob pattern matching for finding node
glob = "0.3"

# Which utility for finding executables
which = "7.0"

# System integration (Linux systemd, macOS launchd)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
